<!-- templates/products.html -->
{% extends "base.html" %}

{% block title %}Products{% endblock %}

{% block content %}
<h1>Products</h1>
<button id="addProductBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Add Product</button>
<div id="productsGrid" class="ag-theme-alpine" style="height: 600px; width: 100%;"></div>
{% endblock %}

{% block modal %}
<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Add Product</h2>
        <form id="productForm" method="POST">
            <input type="hidden" id="productId" name="id">
            <div class="form-group">
                <label for="sku">SKU</label>
                <input type="text" id="sku" name="sku" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" required>
            </div>
            <div class="form-group">
                <label for="price">Price</label>
                <input type="text" id="price" name="price" required>
            </div>
            <div class="form-group">
                <label for="isManufactured">
                    <input type="checkbox" id="isManufactured" name="is_manufactured">
                    Manufactured in WA (counts toward B&amp;O manufacturing)
                </label>
            </div>
            <div class="form-group">
                <label for="isArchived">
                    <input type="checkbox" id="isArchived" name="archived">
                    Archived (hidden from new-sale product lists)
                </label>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Product</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var gridOptions = {
            autoSizeStrategy: {
                type: "fitCellContents",
            },
            columnDefs: [
                {
                    headerName: '',
                    field: 'delete',
                    cellRenderer: function(params) {
                        return '<i class="fas fa-trash text-danger delete-product" style="cursor: pointer;"></i>';
                    },
                    onCellClicked: function(params) {
                        if (confirm("Are you sure you want to delete this product?")) {
                            deleteProduct(params.data.id);
                        }
                    },
                    maxWidth: 40,
                    sortable: false,
                    filter: false,
                    resizable: false,
                    suppressAutoSize: true,
                    suppressSizeToFit: true
                },
                {
                    headerName: '',
                    field: 'edit',
                    cellRenderer: function(params) {
                        return '<i class="fas fa-edit text-primary edit-product" style="cursor: pointer;"></i>';
                    },
                    onCellClicked: function(params) {
                        editProduct(params.data.id);
                    },
                    maxWidth: 40,
                    sortable: false,
                    filter: false,
                    resizable: false,
                    suppressAutoSize: true,
                    suppressSizeToFit: true
                },
                { headerName: 'SKU', field: 'sku', sortable: true, sort: 'asc', filter: true },
                { headerName: 'Description', field: 'description', sortable: true, filter: true },
                { headerName: 'Price', field: 'price',
                    valueFormatter: p => '$' + p.value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
                    sortable: true, filter: 'agNumberColumnFilter', comparator: greaterlessComparator },
                { headerName: 'Manufactured', field: 'is_manufactured', maxWidth: 140, sortable: true, filter: true,
                    cellRenderer: params => params.value ? '<i class="fas fa-check"></i>' : ''
                },
                { headerName: 'Archived', field: 'archived', maxWidth: 110, sortable: true, filter: true,
                    cellRenderer: params => params.value ? '<i class="fas fa-archive"></i>' : ''
                }
            ],
            // Data is loaded from /api/products (see below), not embedded in the page
            rowData: [],
            getRowStyle: params => params.data && params.data.archived ? { opacity: '0.5' } : null,
            defaultColDef: {
                flex: 1,
                minWidth: 100,
                resizable: true,
                comparator: caseInsensitiveComparator,
                filterParams: {
                    buttons: ["apply", "reset"],
                    closeOnApply: true
                }
            }
        };

        var gridDiv = document.querySelector('#productsGrid');
        gridApi = agGrid.createGrid(gridDiv, gridOptions);
        refreshGrid('/api/products', gridApi);
    });

    function serverError(xhr) {
        return (xhr.responseJSON && xhr.responseJSON.error) || "Unexpected server error";
    }

    function archiveProduct(productId) {
        $.ajax({
            url: "/products/archive/" + productId,
            method: "POST",
            success: function() {
                refreshGrid('/api/products', gridApi);
            },
            error: function(xhr) {
                alert("Error archiving product: " + serverError(xhr));
            }
        });
    }

    function deleteProduct(productId) {
        $.ajax({
            url: "/products/delete/" + productId,
            method: "POST",
            success: function() {
                refreshGrid('/api/products', gridApi);
            },
            error: function(xhr) {
                if (xhr.status === 409) {
                    if (confirm(serverError(xhr) + "\n\nArchive it now?")) {
                        archiveProduct(productId);
                    }
                } else {
                    alert("Error deleting product: " + serverError(xhr));
                }
            }
        });
    }

    function editProduct(productId) {
        // Implement edit functionality (e.g., open modal)
        $("#modalTitle").text("Edit Product");
        $.get("/api/product/" + productId, function(data) {
            $("#productId").val(data.id);
            $("#sku").val(data.sku);
            $("#description").val(data.description);
            $("#price").val(('$' + data.price.toFixed(2).replace(/\B(?=(?:\d{3})+(?!\d))/g, ',')));
            $("#isManufactured").prop("checked", data.is_manufactured);
            $("#isArchived").prop("checked", data.archived);
            $("#productModal").show();
        });
    }

    $(document).ready(function() {
        var modal = $("#productModal");
        var addBtn = $("#addProductBtn");
        var closeBtn = $(".close");
        var form = $("#productForm");
    
        // Initialize Cleave.js for price formatting
        var cleave = new Cleave('#price', {
            numeral: true,
            numeralThousandsGroupStyle: 'thousand',
            prefix: '$',
            rawValueTrimPrefix: true
        });
    
        addBtn.click(function() {
            $("#modalTitle").text("Add Product");
            form[0].reset();
            $("#productId").val("");
            cleave.setRawValue('');
            modal.show();
        });
    
        closeBtn.click(function() {
            modal.hide();
        });
    
        $(window).click(function(event) {
            if (event.target == modal[0]) {
                modal.hide();
            }
        });
    
        form.submit(function(e) {
            e.preventDefault();
            var url = $("#productId").val() ? "/products/edit/" + $("#productId").val() : "/products/add";
            $.ajax({
                url: url,
                method: "POST",
                data: JSON.stringify({
                    sku: $("#sku").val(),
                    description: $("#description").val(),
                    price: cleave.getRawValue(),
                    is_manufactured: $("#isManufactured").prop("checked"),
                    archived: $("#isArchived").prop("checked")
                }),
                contentType: "application/json",
                success: function() {
                    modal.hide();
                    refreshGrid('/api/products', gridApi);
                },
                error: function(xhr) {
                    alert("Error saving product: " + serverError(xhr));
                }
            });
        });
    });
    </script>
{% endblock %}
