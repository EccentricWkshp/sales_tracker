<!-- templates/sales.html -->
{% extends "base.html" %}

{% block title %}Sales{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Sales</h1>
        <p class="page-subtitle">{{ sales|length }} sales receipt{{ '' if sales|length == 1 else 's' }}.</p>
    </div>
</div>

<div class="toolbar">
    <button id="addSaleBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Add Sale</button>
    <a href="{{ url_for('pending_orders') }}" id="pendingOrdersLink" class="btn btn-secondary" style="display: none;">
        <i class="fas fa-inbox"></i> Pending Orders <span class="badge" id="pendingOrdersCount"></span>
    </a>
    <div class="toolbar-spacer"></div>
    <input type="search" id="salesQuickFilter" class="form-control input-large"
           placeholder="Search sales…" aria-label="Search sales">
    <button id="exportSaleBtn" class="btn btn-secondary"><i class="fas fa-file-csv"></i> Export CSV</button>
</div>

<div id="salesGrid" class="ag-theme-alpine" style="height: 640px; width: 100%;"></div>
{% endblock %}

{% block modal %}
<div id="saleModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Add Sale</h2>
        <form id="saleForm" method="POST">
            <input type="hidden" id="saleId" name="id">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="time">Time (optional)</label>
                <input type="time" id="time" name="time">
            </div>
            <div class="form-group">
                <label for="external_order_number">Order # (from the selling platform)</label>
                <input type="text" id="external_order_number" name="external_order_number">
            </div>
            <div class="form-group">
                <label for="customer">Customer</label>
                <select id="customer" name="customer_id" required>
                    <option value="">Select a customer</option>
                    {% for customer in customers %}
                        <option value="{{ customer.id }}">{{ customer.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="shipservice">Shipping:</label>
                <select type="text" id="shipservice" name="shipservice">
                    <option value=""></option>
                    <option value="USPS">USPS</option>
                    <option value="UPS">UPS</option>
                    <option value="FedEx">FedEx</option>
                    <option value="DHL">DHL</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="shipdate">Ship Date:</label>
                <input type="date" id="shipdate" name="shipdate">
            </div>
            <div class="form-group">
                <label for="tracking">Tracking</label>
                <input type="text" id="tracking" name="tracking">
            </div>
            <div id="lineItems">
                <!-- Line items will be added here dynamically -->
            </div>
            <button type="button" id="addLineItem" class="btn btn-secondary"><i class="fas fa-plus"></i> Add Product</button>
            <div class="summary">
                <div class="form-group">
                    <label for="subtotal">Subtotal</label>
                    <input type="text" id="subtotal" name="subtotal" readonly>
                </div>
                <div class="form-group">
                    <label for="tax">Tax</label>
                    <input type="text" id="tax" name="tax" value="$0.00">
                </div>
                <div class="form-group">
                    <label for="shipping">Shipping</label>
                    <input type="text" id="shipping" name="shipping" value="$0.00">
                </div>
                <div class="form-group">
                    <label for="total">Total</label>
                    <input type="text" id="total" name="total" readonly>
                </div>
                <div class="form-group">
                    <label for="customer_notes">Customer Notes</label>
                    <textarea id="customer_notes" name="customer_notes" class="form-control" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="internal_notes">Internal Notes</label>
                    <textarea id="internal_notes" name="internal_notes" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="actions">
                <button type="button" class="btn btn-close"><i class="fas fa-times"></i> Cancel</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Sale</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}

<script>
document.addEventListener('DOMContentLoaded', function() {       
    var gridOptions = {
        autoSizeStrategy: {
            type: "fitCellContents",
        },
        pagination: true,
        paginationPageSize: 100,
        paginationPageSizeSelector: [100, 200, 500, 1000],
        columnDefs: [
            {
                headerName: '',
                field: 'delete',
                cellRenderer: function(params) {
                    return '<i class="fas fa-trash text-danger delete-sale" style="cursor: pointer;"></i>';
                },
                onCellClicked: function(params) {
                    if (confirm("Are you sure you want to delete this sale?")) {
                        deleteSale(params.data.id, '/api/sales', gridApi);
                    }
                },
                maxWidth: 40,
                sortable: false,
                filter: false,
                resizable: false,
                suppressAutoSize: true,
                suppressSizeToFit: true
            },
            {
                headerName: '',
                field: 'edit',
                cellRenderer: function(params) {
                    return '<i class="fas fa-edit text-primary" style="cursor: pointer;"></i>';
                },
                onCellClicked: function(params) {
                    window.location.href = "/sales/edit/" + params.data.id;
                },
                maxWidth: 40,
                sortable: false,
                filter: false,
                resizable: false,
                suppressAutoSize: true,
                suppressSizeToFit: true
            },
            {
                headerName: '',
                field: 'print',
                cellRenderer: function(params) {
                    return '<i class="fas fa-print text-primary" style="cursor: pointer;"></i>';
                },
                onCellClicked: function(params) {
                    window.open("/sales/print/" + params.data.id, '_blank');
                },
                maxWidth: 40,
                sortable: false,
                filter: false,
                resizable: false,
                suppressAutoSize: true,
                suppressSizeToFit: true
            },
            {
                headerName: 'Date',
                field: 'date',
                sortable: true,
                sort: 'desc',
                filter: 'agDateColumnFilter',
                comparator: dateComparator,
                filterParams: {
                    comparator: function(filterLocalDateAtMidnight, cellValue) {
                        var dateParts = cellValue.split('-');
                        var cellDate = new Date(Number(dateParts[2]), Number(dateParts[0]) - 1, Number(dateParts[1]));

                        if (cellDate < filterLocalDateAtMidnight) {
                            return -1;
                        } else if (cellDate > filterLocalDateAtMidnight) {
                            return 1;
                        } else {
                            return 0;
                        }
                    }
                },
                valueFormatter: function(params) {
                    var dateParts = params.value.split('-');
                    return `${dateParts[0]}-${dateParts[1]}-${dateParts[2]}`;
                }
            },{
                headerName: 'Ship Date',
                field: 'shipdate',
                sortable: true,
                filter: 'agDateColumnFilter',
                comparator: dateComparator,
                filterParams: {
                    comparator: function(filterLocalDateAtMidnight, cellValue) {
                        var dateParts = cellValue.split('-');
                        var cellDate = new Date(Number(dateParts[2]), Number(dateParts[0]) - 1, Number(dateParts[1]));

                        if (cellDate < filterLocalDateAtMidnight) {
                            return -1;
                        } else if (cellDate > filterLocalDateAtMidnight) {
                            return 1;
                        } else {
                            return 0;
                        }
                    }
                }
            },
            { headerName: 'Order #', field: 'external_order_number', sortable: true, filter: true },
            { headerName: 'Receipt #', field: 'receipt_number', sortable: true, filter: true },
            { headerName: 'Customer', field: 'customer_name', sortable: true, filter: true, flex: 2 },
            { headerName: 'Total', field: 'total', valueFormatter: currencyFormatter, type: 'rightAligned', sortable: true, filter: 'agNumberColumnFilter', comparator: greaterlessComparator },
            { headerName: 'Tax', field: 'tax', valueFormatter: currencyFormatter, type: 'rightAligned', sortable: true, filter: 'agNumberColumnFilter', comparator: greaterlessComparator },
            { headerName: 'Shipping', field: 'shipping', valueFormatter: currencyFormatter, type: 'rightAligned', sortable: true, filter: 'agNumberColumnFilter', comparator: greaterlessComparator }
        ],
        // Numeric money values so the number filters and sorting compare numbers,
        // not strings ('9.00' used to sort above '10.00')
        rowData: [
            {% for sale in sales %}
            {
                id: {{ sale.id }},
                date: '{{ sale.date.strftime('%m-%d-%Y') }}',
                shipdate: '{{ sale.shipdate.strftime('%m-%d-%Y') if sale.shipdate else '' }}',
                external_order_number: '{{ sale.external_order_number|cleaned }}',
                receipt_number: '{{ sale.receipt_number|cleaned }}',
                customer_name: '{{ sale.customer.name|cleaned if sale.customer else 'N/A' }}',
                total: {{ "%.2f"|format(sale.total) }},
                tax: {{ "%.2f"|format(sale.tax) }},
                shipping: {{ "%.2f"|format(sale.shipping) }}
            },
            {% endfor %}
        ],
        defaultColDef: {
            minWidth: 100,
            resizable: true,
            comparator: caseInsensitiveComparator,
            filterParams: {
                buttons: ["apply", "reset"],
                closeOnApply: true
            }
        },
        onRowClicked: function(params) {
            if (!params.event.target.classList.contains('delete-sale') && !params.event.target.classList.contains('fa-edit') && !params.event.target.classList.contains('fa-print')) {
                window.location.href = "/sales/view/" + params.data.id;
            }
        }
    };

    // Add event listener for the export button
    document.getElementById('exportSaleBtn').addEventListener('click', function() {
        var dateRange = getDateFilterRange();
        var fileName = 'Sales_Export.csv';
        if (dateRange && dateRange.fromDate && dateRange.toDate) {
            fileName = `Sales_${dateRange.fromDate}_to_${dateRange.toDate}.csv`;
        }

        var params = {
            fileName: fileName
        };

        gridApi.exportDataAsCsv(params);
    });

    var gridDiv = document.querySelector('#salesGrid');
    gridApi = agGrid.createGrid(gridDiv, gridOptions);

    // Only advertise the pending queue when something is actually waiting
    fetch('/api/pending_orders/count')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.count) {
                document.getElementById('pendingOrdersCount').textContent = data.count;
                document.getElementById('pendingOrdersLink').style.display = '';
            }
        })
        .catch(function() { /* the link just stays hidden */ });

    // Free-text search across every column, alongside the per-column filters
    var quickFilter = document.getElementById('salesQuickFilter');
    if (quickFilter) {
        quickFilter.addEventListener('input', function() {
            gridApi.setGridOption('quickFilterText', this.value);
        });
    }

    // Check if we need to open the modal with pre-populated customer
    const urlParams = new URLSearchParams(window.location.search);
    const openModal = urlParams.get('open_modal');
    const customerId = urlParams.get('customer_id');
    
    if (openModal === 'true' && customerId) {
        var modal = $("#saleModal");
        $("#modalTitle").text("Add Sale");
        
        // Open the modal
        modal.show();

        // Set the customer in the Select2 dropdown
        $('#customer').val(customerId).trigger('change');

        // Optionally, if you want to disable changing the customer
        // $('#customer').prop('disabled', true);
    }
});

$(document).ready(function() {
    var modal = $("#saleModal");
    var addBtn = $("#addSaleBtn");
    var closeBtn = $(".close");
    var closeBtn2 = $(".btn-close");
    var form = $("#saleForm");
    var lineItemCount = 0;

    // Initialize Cleave.js for currency formatting
    var currencyInputs = {
        shipping: new Cleave('#shipping', {
            numeral: true,
            numeralThousandsGroupStyle: 'thousand',
            prefix: '$',
            rawValueTrimPrefix: true
        }),
        subtotal: new Cleave('#subtotal', {
            numeral: true,
            numeralThousandsGroupStyle: 'thousand',
            prefix: '$',
            rawValueTrimPrefix: true
        }),
        tax: new Cleave('#tax', {
            numeral: true,
            numeralThousandsGroupStyle: 'thousand',
            prefix: '$',
            rawValueTrimPrefix: true
        }),
        total: new Cleave('#total', {
            numeral: true,
            numeralThousandsGroupStyle: 'thousand',
            prefix: '$',
            rawValueTrimPrefix: true
        })
    };

    addBtn.click(function() {
        $("#modalTitle").text("Add Sale");
        form[0].reset();
        $('#customer').select2({
            placeholder: 'Select a customer',
            allowClear: true,
            width: '400px'
        });
        $("#saleId").val("");
        $("#lineItems").empty();
        lineItemCount = 0;
        // Default the date to today (local time); time is left blank
        var now = new Date();
        $("#date").val(now.getFullYear() + '-' +
            String(now.getMonth() + 1).padStart(2, '0') + '-' +
            String(now.getDate()).padStart(2, '0'));
        $("#time").val("");
        currencyInputs.shipping.setRawValue('0.00');
        currencyInputs.tax.setRawValue('0.00');
        updateTotals();
        modal.show();
    });

    $(".edit-sale").click(function() {
        var saleId = $(this).data("id");
        $("#modalTitle").text("Edit Sale");
        $.get("/sales/get/" + saleId, function(data) {
            $("#saleId").val(data.id);
            $("#customer").val(data.customer_id);
            currencyInputs.shipping.setRawValue(data.shipping);
            $("#lineItems").empty();
            lineItemCount = 0;
            data.line_items.forEach(function(item) {
                addLineItem(item);
            });
            updateTotals();
            modal.show();
        });
    });

    closeBtn.click(function() {
        $('#customer').prop('disabled', false);
        modal.hide();
    });

    closeBtn2.click(function() {
        $('#customer').prop('disabled', false);
        modal.hide();
    });

    $(window).click(function(event) {
        if (event.target == modal[0]) {
            $('#customer').prop('disabled', false);
            modal.hide();
        }
    });

    $("#addLineItem").click(function() {
        addLineItem();
    });

    function addLineItem(item = null) {
        lineItemCount++;
        var lineItem = `
            <div class="line-item">
                <h3>Product ${lineItemCount}</h3>
                <div class="form-group">
                    <label for="product_${lineItemCount}">Product</label>
                    <select id="product_${lineItemCount}" class="product-select" required>
                        <option value="">Select a product</option>
                        {% for product in products %}
                            <option value="{{ product.id }}" data-price="{{ product.price }}">{{ product.sku }} - {{ product.description }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity_${lineItemCount}">Quantity</label>
                    <input type="number" id="quantity_${lineItemCount}" class="quantity" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label for="price_${lineItemCount}">Price</label>
                    <input type="text" id="price_${lineItemCount}" class="price">
                </div>
                <div class="form-group">
                    <label for="total_${lineItemCount}">Total</label>
                    <input type="text" id="total_${lineItemCount}" class="line-total" readonly>
                </div>
                <button type="button" class="btn btn-secondary btn-danger remove-line-item"><i class="fas fa-trash"></i> Remove</button>
            </div>
        `;
        $("#lineItems").append(lineItem);
        
        // Initialize Cleave.js for the new line item
        new Cleave(`#price_${lineItemCount}`, {
            numeral: true,
            numeralThousandsGroupStyle: 'thousand',
            prefix: '$',
            rawValueTrimPrefix: true
        });
        new Cleave(`#total_${lineItemCount}`, {
            numeral: true,
            numeralThousandsGroupStyle: 'thousand',
            prefix: '$',
            rawValueTrimPrefix: true
        });
        
        if (item) {
            $(`#product_${lineItemCount}`).val(item.product_id);
            $(`#quantity_${lineItemCount}`).val(item.quantity);
            $(`#price_${lineItemCount}`).val(item.price_each);
            $(`#total_${lineItemCount}`).val(item.total_price);
        }
        
        updateLineTotals($(`#lineItems .line-item`).last());
    }

    // Parses "$1,234.56" (Cleave-formatted) as well as plain numbers
    function parseMoney(value) {
        return parseFloat(String(value || '').replace(/[^0-9.-]/g, '')) || 0;
    }

    $(document).on('change', '.product-select', function() {
        var lineItem = $(this).closest('.line-item');
        var price = $(this).find(':selected').data('price');
        // Pre-fill from the product's list price; still editable to override
        lineItem.find('.price').val(price);
        updateLineTotals(lineItem);
    });

    $(document).on('input', '.quantity', function() {
        updateLineTotals($(this).closest('.line-item'));
    });

    $(document).on('input', '.price', function() {
        updateLineTotals($(this).closest('.line-item'));
    });

    $(document).on('click', '.remove-line-item', function() {
        $(this).closest('.line-item').remove();
        updateTotals();
    });

    $("#shipping, #tax").on('input', function() {
        updateTotals();
    });

    function updateLineTotals(lineItem) {
        var quantity = parseInt(lineItem.find('.quantity').val()) || 0;
        var price = parseMoney(lineItem.find('.price').val());
        var total = quantity * price;
        lineItem.find('.line-total').val(total.toFixed(2));
        updateTotals();
    }

    function updateTotals() {
        var subtotal = 0;
        $('.line-total').each(function() {
            subtotal += parseMoney($(this).val());
        });
        currencyInputs.subtotal.setRawValue(subtotal.toFixed(2));

        // Tax and shipping are entered manually; the total just reflects them
        var shipping = parseFloat(currencyInputs.shipping.getRawValue()) || 0;
        var tax = parseFloat(currencyInputs.tax.getRawValue()) || 0;
        currencyInputs.total.setRawValue((subtotal + tax + shipping).toFixed(2));
    }

    form.submit(function(e) {
        e.preventDefault();
        var url = $("#saleId").val() ? "/sales/edit/" + $("#saleId").val() : "/sales/add";
        var lineItems = [];
        $('.line-item').each(function() {
            lineItems.push({
                product_id: $(this).find('.product-select').val(),
                quantity: $(this).find('.quantity').val(),
                price_each: $(this).find('.price').val().replace('$', ''),
                total_price: $(this).find('.line-total').val().replace('$', '')
            });
        });
        
        $.ajax({
            url: url,
            method: "POST",
            data: JSON.stringify({
                customer_id: $("#customer").val(),
                date: $("#date").val(),
                time: $("#time").val(),
                shipservice: $("#shipservice").val(),
                shipdate: $("#shipdate").val(),
                tracking: $("#tracking").val(),
                line_items: lineItems,
                subtotal: currencyInputs.subtotal.getRawValue(),
                tax: currencyInputs.tax.getRawValue(),
                shipping: currencyInputs.shipping.getRawValue(),
                total: currencyInputs.total.getRawValue(),
                customer_notes: $("#customer_notes").val(),
                internal_notes: $("#internal_notes").val(),
                external_order_number: $("#external_order_number").val(),
            }),
            contentType: "application/json",
            success: function(response) {
                $('#customer').prop('disabled', false);
                modal.hide();
                refreshGrid('/api/sales', gridApi);
                showFlashMessage('Sale #' + response.id + ' saved.', 'success');
            },
            error: function(xhr) {
                showFlashMessage('Error saving sale: ' + serverMessage(xhr), 'error');
            }
        });
    });
});
</script>

<!-- Allow us to use select2 to filter the customer list -->
<script>
    $(document).ready(function() {
        $('#customer').select2({
            placeholder: 'Select a customer',
            allowClear: true,
            width: '400px'
        });
    });
</script>
{% endblock %}
